name: GenomeMemory fixture export
on: [push, pull_request]
jobs:
  fixture-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'cryptography>=43' 'fastapi>=0.111.0' 'httpx>=0.27' 'requests>=2.32.3'
      - run: python -m unittest discover -s tests -v
