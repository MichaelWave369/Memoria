name: GenomeMemory fixture export
on: [push, pull_request]
jobs:
  fixture-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'cryptography>=43' 'fastapi>=0.111.0' 'httpx>=0.27' 'requests>=2.32.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m unittest discover -s tests -v
      - name: Recompute frozen retrieval experiment
        run: node research/recall/check.mjs
      - name: Recompute frozen abstention experiment
        run: node research/recall/check-abstention.mjs
      - name: Recompute frozen relation provenance experiment
        run: node research/recall/check-provenance.mjs
  native-vector-cleanup:
    runs-on: ubuntu-latest
    env:
      MEMORIA_NATIVE_CHROMA_FIXTURES: '1'
      ANONYMIZED_TELEMETRY: 'False'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'cryptography>=43' 'chromadb==1.0.20'
      - run: python -c "import chromadb; print('Native Chroma version:', chromadb.__version__)"
      - run: python -m unittest discover -s tests -p 'test_native_vector_cleanup_r11.py' -v
