name: GenomeMemory fixture export
on: [push, pull_request]
jobs:
  fixture-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m unittest discover -s tests -v
      - name: Recompute frozen retrieval experiment
        run: node research/recall/check.mjs
      - name: Recompute frozen abstention experiment
        run: node research/recall/check-abstention.mjs
      - name: Recompute frozen relation provenance experiment
        run: node research/recall/check-provenance.mjs
  native-vector-cleanup:
    runs-on: ubuntu-latest
    env:
      MEMORIA_NATIVE_CHROMA_FIXTURES: '1'
      ANONYMIZED_TELEMETRY: 'False'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-native.txt
      - run: python -c "import chromadb; print('Native Chroma version:', chromadb.__version__)"
      - run: python -m unittest discover -s tests -p 'test_native_vector_cleanup_r11.py' -v
      - run: python -m unittest discover -s tests -p 'test_native_vector_recovery_r11.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/checkout@v4
        with:
          repository: MichaelWave369/PhiMemory9
          ref: d897308cb0af166bda9c897eac6ed03d8958577d
          path: native/PhiMemory9
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: MichaelWave369/NBGPocketMesh
          ref: 0687f10970989194d4af554d9b189c7ce8a1ad15
          path: native/NBGPocketMesh
          persist-credentials: false
      - name: Cold restore and native continuity witness
        env:
          MEMORIA_NATIVE_PHI_MEMORY: ${{ github.workspace }}/native/PhiMemory9
          MEMORIA_NATIVE_POCKETMESH: ${{ github.workspace }}/native/NBGPocketMesh
        run: python -m unittest discover -s tests -p 'test_native_retention_continuity_r11.py' -v
  operator-ui-smoke:
    runs-on: ubuntu-latest
    env:
      MEMORIA_UI_FIXTURES: '1'
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_operator_ui_refresh.py' -v
